# =====================================================================
# rules.yaml — ПРАВИЛА ОПАСНОСТИ
# =====================================================================
# Каждое правило ОБЯЗАНО иметь поле `source` — ссылку на пункт ППР,
# паспорт крана/стропов или нормативный документ. Отчёт, собранный
# автоматом, печатает `source` рядом с каждым нарушением: так выводы
# защищаются перед инспектором и ПТО.
#
# Все предельные значения — ИЗ ВАШИХ ДОКУМЕНТОВ. Числа ниже —
# демонстрационные (sample), замените на данные своего ППР.
# =====================================================================

meta:
  project: "Пилот: башня 400 м, ярус L62"
  site_elevation_m: 400          # высотная отметка площадки -> плотность воздуха
  wind_ref_height_m: 10          # высота анемометра метеостанции объекта
  wind_terrain_alpha: 0.16       # показатель степенного профиля ветра (открытая местность/берег)
  wind_roughness_z0_m: 0.05      # шероховатость местности для Iu(z) по EN 1991-1-4 (II категория)
  # Политика порыва: measured = перенос измеренного порыва (есть анемометр),
  # model = mean(z)*G(z) по интенсивности турбуентности, max = консервативно.
  wind_gust_policy: measured
  # ВАЖНО: лимиты ветра в паспорте крана и в большинстве ППР нормированы
  # к высоте 10 м. Сравнивать измерение с лимитом нужно НА ОДНОЙ высоте.
  wind_limit_basis: ref_height   # ref_height | work_height  (см. docs/methodology.md)
  wind_extrapolation_max_ratio: 8   # выше этого z/z_ref степенной профиль ненадёжен -> предупреждение
  work_window: ["2026-11-16 07:00", "2026-11-22 20:00"]
  timezone: "Europe/Istanbul"
  version: "0.1.0-sample"
  disclaimer: >
    Результат симуляции — аналитическая поддержка решений. Он НЕ заменяет
    расчёты ППР, паспорт крана, схемы строповки, нормативные документы
    и решение ответственного инженера.

# ---------------------------------------------------------------------
# ГЛОБАЛЬНЫЕ ФИЗИЧЕСКИЕ КОНСТАНТЫ И ДОПУЩЕНИЯ
# ---------------------------------------------------------------------
physics:
  g: 9.80665                     # м/с2
  rho_sea_level: 1.225           # кг/м3
  air_density_model: "barometric"   # barometric | constant
  moving_anchor: true              # полная траектория опоры по фазам ППР; только MuJoCo
  collision_geometry: true         # контакты груза с перекрытиями и ядром; только MuJoCo
  moving_timestep_s: 0.2           # черновой шаг полной операции; для финала требуется проверка сходимости
  moving_sample_s: 5.0             # шаг записи траектории и контактов
  default_cd_range: [1.1, 1.6]   # плоская панель / щит опалубки, ПРОВЕРИТЬ по справочнику
  dynamic_amplification:         # коэффициент динамики при подъёме (из ППР/норм)
    smooth: 1.10
    normal: 1.20
    abrupt: 1.35
  sling_included_angle_limit_deg: 90   # предел угла между ветвями (тип. требование к стропам)
  sling_derating_note: >
    При угле ветви к горизонтали ниже 60 град. несущая способность стропа
    снижается — используйте таблицы производителя стропа, а не только
    геометрический множитель 1/sin(a).

# ---------------------------------------------------------------------
# ЛЮДИ
# ---------------------------------------------------------------------
people:
  tagline_force_per_person_N: 200      # длительно допустимое усилие на оттяжке, ОЦЕНИТЬ с ПТО
  tagline_force_peak_per_person_N: 400 # кратковременное (рывок)
  tagline_effectiveness: 0.7           # доля усилия, реально передаваемая на груз (угол, скольжение)
  max_tagline_people: 4
  walk_speed_ms: {mean: 1.1, sigma: 0.25}   # логнормальное распределение
  min_clearance_to_load_m: 5.0         # безопасное удаление от груза на подвесе
  edge_proximity_warn_m: 2.0           # ближе к краю — предупреждение
  break_every_min: 120                 # регламентный перерыв
  task_start_delay_min: {mean: 15, scale: 10}   # опоздание бригады, экспоненциально+сдвиг

# ---------------------------------------------------------------------
# ПРАВИЛА
# ---------------------------------------------------------------------
# severity: critical | high | medium | low
# enabled: false — правило считается, но не блокирует отчёт (для отладки)
rules:

  - id: no_two_crews_same_zone
    title: "Две бригады в одной рабочей зоне одновременно"
    severity: medium
    enabled: true
    source: "ППР раздел 6.3 (совмещение работ по вертикали/горизонтали); внутренний стандарт подрядчика"
    params:
      zone_types: [work]
      min_overlap_min: 15        # игнорировать пересечения короче этого

  - id: no_work_under_crane_hazard
    title: "Люди в зоне работы крана во время подъёма (под грузом)"
    severity: critical
    enabled: true
    source: "ППК/ППР раздел 'Требования при производстве работ кранами'; п. Правил охраны труда при работе на высоте"
    params:
      hazard_types: [crane_hazard]
      mode: dynamic            # dynamic | static | both
      corridor_width_m: 8.0    # ширина коридора под траекторией груза
      end_radius_m: 6.0        # круг под точкой строповки и приёмки
      load_proximity_m: 8.0    # дополнительно: близость к точке приёмки
      same_level_tol_m: 12.0   # допуск по высоте: какой ярус считать тем же

  - id: edge_work_requires_guardrail
    title: "Работа у края перекрытия без ограждения"
    severity: critical
    enabled: true
    source: "Правила охраны труда при работе на высоте: ограждение/страховочная система при перепаде >= 1.8 м"
    params:
      zone_types: [edge]
      # защитная мера, которая снимает нарушение (из графика работ):
      mitigation_task_tags: [guardrail_installed]
      fall_height_m: 1.8

  - id: stop_crane_ops_above_wind_limit
    title: "Подъём при ветре выше лимита ППР"
    severity: critical
    enabled: true
    source: "Паспорт крана + ППР таблица 'Предельные значения ветра для монтажа'"
    params:
      use_gust: true             # сравнивать порыв, а не только среднюю скорость
      # basis берётся из meta.wind_limit_basis: лимит паспорта нормирован к 10 м,
      # поэтому сравнение идёт на высоте измерения. Отдельно в отчёт выводится
      # пересчитанная скорость на высоте работ — для физики груза.
      height_correction: true

  - id: tagline_force_within_capacity
    title: "Требуемое усилие на оттяжке превышает возможности людей"
    severity: high
    enabled: true
    source: "ППР схема строповки и раздел 'Удержание груза оттяжками'"
    params:
      margin: 1.0                # запас >= 1.0 (т.е. без запаса); задайте свой

  - id: sling_utilization_limit
    title: "Использование несущей способности стропа выше лимита"
    severity: critical
    enabled: true
    source: "Паспорт/сертификат стропа; схема строповки ППР"
    params:
      max_utilization: 0.80      # 80 % от WLL — типовой рабочий лимит, ЗАДАТЬ свой

  - id: crane_radius_within_chart
    title: "Вылет/масса вне грузовой характеристики крана"
    severity: critical
    enabled: true
    source: "Грузовая характеристика крана (паспорт), таблица для данного вылета и упора"
    params:
      max_utilization: 0.90

  - id: passage_must_stay_clear
    title: "Работа или склад перекрывает проход/путь эвакуации"
    severity: high
    enabled: true
    source: "План организации площадки (ПОС/ППР), пути эвакуации"
    params:
      zone_types: [passage]
      blocking_types: [storage]
      blocking_hazard_tags: [passage, evacuation, storage]
      min_overlap_min: 10

  - id: no_simultaneous_lift_and_pour
    title: "Подъём грузов над зоной бетонирования"
    severity: high
    enabled: true
    source: "ППР раздел 'Бетонные работы' — запрет подачи материалов над людьми"
    params:
      pour_tag: concrete_pour
      # вместо тега можно искать задачи, у которых оборудование — бетононасос:
      pour_equipment_prefix: "CP"

  - id: no_work_below_active_work
    title: "Работы на нижнем ярусе под активной зоной работ (падение предметов)"
    severity: high
    enabled: true
    source: "ППР раздел 'Совмещённые работы по вертикали'; требование разделения ярусов по времени"
    params:
      min_level_gap_m: 2.5       # минимальный перепад высот, при котором правило срабатывает
      min_overlap_fraction: 0.25 # доля пересечения в плане
      min_overlap_min: 30

  - id: load_path_over_people
    title: "Траектория перемещения груза проходит над зоной с людьми"
    severity: critical
    enabled: true
    source: "ППР 'Пути перемещения грузов краном'; запрет перемещения груза над людьми"
    params:
      consider_zone_types: [work, passage]
